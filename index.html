<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tile Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=10">
</head>
<body>
<div class="wrap">
  <nav class="tabs" id="tabs" aria-label="Areas"></nav>

  <!-- Overview: one card per area -->
  <main id="indexView" hidden>
    <header class="title">
      <div>
        <h1>Tile selections</h1>
        <p class="sub" id="indexSub"></p>
      </div>
      <div class="actions">
        <button type="button" class="seg-btn" id="addArea">Add area</button>
        <button type="button" class="seg-btn share" id="shareIndex">Share</button>
      </div>
    </header>
    <section class="empty" id="empty" hidden>
      <p>No areas yet.</p>
      <div class="row">
        <button type="button" class="seg-btn primary" id="addFirst">Add your first area</button>
        <button type="button" class="seg-btn" id="resume" hidden></button>
      </div>
    </section>
    <div class="cards" id="cards"></div>
  </main>

  <!-- One area -->
  <main id="placeView" hidden>
    <header class="title">
      <div>
        <h1 id="title"></h1>
        <p class="sub" id="subtitle"></p>
      </div>
      <button type="button" class="seg-btn" id="editArea">Edit area</button>
    </header>

    <section class="stage" aria-label="Tile preview">
      <div class="area-bar" id="areaControls"></div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="cv" role="img" aria-label="Preview of the selected tiles with the chosen grout colour"></canvas>
      </div>
      <div class="readout">
        <div class="facts" id="readout"></div>
        <div class="actions">
          <button type="button" class="seg-btn" id="reset">Reset</button>
          <button type="button" class="seg-btn share" id="share">Share</button>
        </div>
      </div>
    </section>

    <div class="controls">
      <section class="panel" aria-labelledby="gh" id="groutPanel">
        <h2 id="gh">Grout</h2>
        <div class="field" id="groutSuggest" hidden>
          <label id="gsl">Suggested for this tile</label>
          <div class="swatches" role="group" aria-labelledby="gsl" id="groutSuggestSw"></div>
        </div>
        <div class="field">
          <label id="groutAllLabel" hidden>All grouts</label>
          <div class="swatches" role="group" aria-label="Grout colours" id="swatches"></div>
        </div>
        <div class="custom">
          <input type="color" id="custom" value="#cdbfa6" aria-label="Custom grout colour">
          <label for="custom">Custom colour</label>
          <span class="hex" id="customHex"></span>
        </div>
        <div class="field">
          <div class="top"><label for="joint">Grout joint</label><span id="jointOut"></span></div>
          <input type="range" id="joint" min="1" max="8" step="0.5" value="3">
        </div>
      </section>

      <section class="panel" aria-labelledby="lh">
        <h2 id="lh">Tile and layout</h2>
        <div id="tileControls" class="fields"></div>
        <p class="note"><span id="productNote"></span> Tile colours come from product photos, so screen colours will differ from the real tile. Check physical samples before ordering.</p>
      </section>
    </div>
  </main>
</div>

<!-- Add or edit an area: name it, pick a tile. A side sheet on wide screens, full screen on phones. -->
<dialog id="areaDialog" class="sheet" aria-labelledby="dlgTitle">
  <form id="dlgForm" method="dialog" novalidate>
    <header class="sheet-head">
      <h2 id="dlgTitle">Add an area</h2>
      <button type="button" class="icon-btn" id="dlgClose" aria-label="Close">&times;</button>
    </header>
    <div class="sheet-body">
      <div class="field">
        <label for="dlgName">Name</label>
        <input type="text" id="dlgName" maxlength="60" autocomplete="off">
        <p class="err" id="dlgError" hidden></p>
      </div>
      <div class="field">
        <div class="top"><label id="tpl" for="tileSearch">Select a tile</label><span id="tileCount"></span></div>
        <input type="search" id="tileSearch" placeholder="Search by name, brand or colour" autocomplete="off">
      </div>
      <div class="tile-library" id="tilePicker" role="group" aria-labelledby="tpl"></div>
      <p class="note" id="tileNone" hidden>No tiles match.</p>
    </div>
    <footer class="sheet-foot">
      <button type="button" class="seg-btn danger" id="dlgDelete">Delete area</button>
      <span class="spacer"></span>
      <button type="button" class="seg-btn" id="dlgCancel">Cancel</button>
      <button type="submit" class="seg-btn primary" id="dlgSave">Add area</button>
    </footer>
  </form>
</dialog>

<script src="js/data.js?v=10"></script>
<script src="js/tiles/mutina.js?v=10"></script>
<script src="js/shapes.js?v=10"></script>
<script src="js/kinds.js?v=10"></script>
<script src="js/painters.js?v=10"></script>
<script src="js/render.js?v=10"></script>
<script src="js/app.js?v=10"></script>
</body>
</html>
